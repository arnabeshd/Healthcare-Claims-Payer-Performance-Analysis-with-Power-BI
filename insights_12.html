<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .minimal-table {
            width: 100%;
            border-collapse: collapse;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 0.95rem;
            color: #222;
                }

        .minimal-table th,
        .minimal-table td {
            padding: 10px 14px;
            text-align: left;
        }

        .minimal-table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            color: #666;
            border-bottom: 2px solid #eaeaea;
        }

        .minimal-table tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.15s ease;
        }

        .minimal-table tbody tr:hover{
            background-color: #fafafa;
        }

        .minimal-table td {
            font-weight: 400;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <table class="minimal-table">
        <thead>
            <tr>
                <th>Encounter Class</th>
                <th>Patient Out-Of-Pocket Expenses %</th>
            </tr>   
        </thead>
        <tbody>
            <tr>
                <td>Ambulatory</td>
                <td>21.42%</td>
            </tr><tr>
                <td>Emergency</td>
                <td>21.30%</td>
            </tr><tr>
                <td>Inpatient</td>
                <td>20.40%</td>
            </tr><tr>
                <td>Outpatient</td>
                <td>21.05%</td>
            </tr><tr>
                <td>Urgentcare</td>
                <td>20.59%</td>
            </tr><tr>
                <td>Wellness</td>
                <td>20.00%</td>
            </tr>
            </tbody>
    </table>  
</body>
</html>
